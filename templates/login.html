{% extends "base.html" %}
{% block titulo %}Entrar · Controle de Produtos{% endblock %}

{% block publico %}
<h1 class="titulo">Entrar</h1>
<p class="apoio">Use o e-mail e a senha da sua conta.</p>

<form method="post" class="formulario">
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" value="{{ email or '' }}" autocomplete="email" required autofocus>

    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" autocomplete="current-password" required>

    <button type="submit" class="botao botao-principal botao-largo">Entrar</button>
</form>

<p class="troca">Ainda não tem conta? <a href="{{ url_for('cadastro') }}">Criar conta</a></p>
{% endblock %}
